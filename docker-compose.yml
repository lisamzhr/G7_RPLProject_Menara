services:
  db:
    image: pgvector/pgvector:pg16
    container_name: roofgarden_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-roofgarden}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d roofgarden"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roofgarden_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/roofgarden
      SECRET_KEY: ${SECRET_KEY:-change-this-to-a-super-secret-random-jwt-key-min-32-chars}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-internal-cron-service-token-secret-xyz123}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BMKG_BASE_URL: ${BMKG_BASE_URL:-https://api.bmkg.go.id/publik}
      OPEN_ELEVATION_BASE_URL: ${OPEN_ELEVATION_BASE_URL:-https://api.open-elevation.com/api/v1/lookup}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
